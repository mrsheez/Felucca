# SPDX-License-Identifier: GPL-3.0-only
# EDDA OS: build the FM-1 package on GitHub's Linux runners (no Mac, no Linux machine, no toolchain at home),
# run the host test suites against the real package, and publish the web installer + editor + package as a
# GitHub Pages site. Install from any computer with Chrome or Edge (WebMIDI), the FM-1 on USB:
#   https://<user>.github.io/<repo>/            (Settings > Pages > Source: GitHub Actions, once)
# The package is also kept as a workflow artifact (Actions > the run > Artifacts > edda-os-fwsc) for the
# offline installer (python3 tools/fm1_install.py felucca-*.fwsc) or the installer page's own file picker.
name: EDDA OS

on:
  push:
    branches: [edda, main, master]
  workflow_dispatch:

permissions:
  contents: write                   # (the ci-out branch: the run's logs and package, readable with git alone)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  EDDA_VERSION: 1.1.5-EDDA          # --release: one digit each (X.Y.Z-suffix); the splash shows v1.1.5-edda

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages (the UI font and icons are rasterised at build time)
        run: pip install Pillow fonttools numpy

      - name: JieLi pi32v2 toolchain (cached between runs)
        id: tc
        uses: actions/cache@v4
        with:
          path: ~/.jieli
          key: jieli-linux-toolchain-${{ hashFiles('tools/get_toolchain.sh') }}
          save-always: true

      - name: Fetch the toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        run: sh tools/get_toolchain.sh "$HOME/.jieli"

      - name: Build the package (tools/build.py; the AC79 SDK files are vendored)
        id: build
        shell: bash
        run: |
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain"
          export AC79_SDK="$PWD/third_party/ac79-sdk-tools"
          # the whole of EDDA OS first; if the image does not fit the FM-1's app slot or the pool's headroom
          # (tools/build.py says so), the same build without the visualisers (EDDA_VIZ=0: ~9 KB less code, 2.8 KB
          # less pool): the run's summary says which shipped
          if ./build.sh --release "$EDDA_VERSION" 2>&1 | tee build-full.log; then
            echo "variant=full" >> "$GITHUB_OUTPUT"
          elif grep -qE "exceeds the app slot|pool headroom" build-full.log; then
            EDDA_VIZ=0 ./build.sh --release "$EDDA_VERSION" 2>&1 | tee build-noviz.log
            test "${PIPESTATUS[0]}" -eq 0
            echo "variant=without the visualisers (the full build did not fit the app slot or the pool)" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi
          grep -h "image .* B; RAM" build-*.log | tail -1 | sed 's/^/size: /' | tee build-size.txt
          cp "build/felucca-$EDDA_VERSION.fwsc" build/felucca.fwsc
          ls -la build/*.fwsc

      - name: Package artifact (download it from the run's page)
        uses: actions/upload-artifact@v4
        with:
          name: edda-os-fwsc
          path: |
            build/felucca-*.fwsc
            build/release-*/
          if-no-files-found: error

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Emscripten (the browser emulator, web/emu)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Host test suites (tests/run_tests.sh against the real package; builds and checks the emulator)
        id: tests
        continue-on-error: true           # (a failed check is reported below; the package and the site still ship)
        run: SANITIZE=1 sh tests/run_tests.sh 2>&1 | tee build/tests.log | tail -60; test "${PIPESTATUS[0]}" -eq 0
        shell: bash

      - name: Site (installer, editor, the package, the emulator)
        run: |
          python3 web/make_site.py "build/felucca-$EDDA_VERSION.fwsc" "$EDDA_VERSION" site
          if [ -f build/emu/felucca.wasm ]; then mkdir -p site/webapp/emu && cp -r build/emu/. site/webapp/emu/; fi
          cp EDDA-OS.md site/EDDA-OS.md
          cp build/tests.log site/tests.log 2>/dev/null || true
          ls -R site | head -40

      - name: Summary (what to download, where the installer is)
        shell: bash
        run: |
          {
            echo "## EDDA OS $EDDA_VERSION"
            echo
            echo "- package: **felucca-$EDDA_VERSION.fwsc** (this run's artifact *edda-os-fwsc*, and firmware/ on the site)"
            echo "- variant: **${{ steps.build.outputs.variant }}**"
            echo "- $(cat build-size.txt 2>/dev/null || echo 'size: see the build step') (app slot 581564 B)"
            echo "- host tests: **${{ steps.tests.outcome }}** (tests.log on the site; the device build above is what ships)"
            echo "- install: open the site's webapp/installer/ in Chrome or Edge with the FM-1 on USB (Settings > Pages > Source: GitHub Actions, once)"
            sha256sum "build/felucca-$EDDA_VERSION.fwsc" | sed 's/^/- sha256: /'
            if [ "${{ steps.tests.outcome }}" != "success" ] && [ -f build/tests.log ]; then
              echo
              echo "### checks that did not pass"
              echo '```'
              grep -E "FAIL|OVER BUDGET" build/tests.log | head -20
              echo '```'
              echo "(tests/target_budget.py's OVER BUDGET on drum_render or fm1_alnk0_irq is EDDA OS's added audio work: the user kits,"
              echo "SEQ OUT, the run, the exact grid; the host CPU check in tests/regress.c is the one that bounds it. After a good"
              echo "test on the FM-1: BUDGET_UPDATE=1 python3 tests/target_budget.py build/felucca.dis tests/target_budget.txt)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: The run's logs and package onto the ci-out branch (readable with git, no site or artifact download needed)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf ci-out && mkdir -p ci-out
          cp build-*.log build-size.txt ci-out/ 2>/dev/null || true
          cp build/felucca-*.fwsc build/tests.log ci-out/ 2>/dev/null || true
          { echo "run ${{ github.run_id }} ${{ github.sha }} $(date -u +%FT%TZ)"; echo "build: ${{ steps.build.outcome }}"; ls -la ci-out; } > ci-out/RUN.txt
          cd ci-out && git init -q && git checkout -q -b ci-out && git add -A && \
            git -c user.name=edda-ci -c user.email=ci@users.noreply.github.com commit -q -m "run ${{ github.run_id }}: build ${{ steps.build.outcome }}" && \
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" ci-out:ci-out

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5     # (turns Pages on for the repository the first time: Source: GitHub Actions)
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
